name: Release

# Publishes to npm when a version tag is pushed:
#   npm version patch|minor|major && gitpush pripman-design-system
#
# Auth: npm trusted publishing (OIDC). No npm token is stored anywhere; npm trusts
# this workflow file (release.yml) in Pripman/pripman-design-system. Provenance is
# generated automatically.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # npm trusted publishing (OIDC) + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false # never use caching in release builds
      - name: Use an npm with trusted publishing support (>= 11.5.1)
        run: npm install -g npm@latest
      - name: Tag must match package.json version
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          if [ "$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json $VERSION" >&2
            exit 1
          fi
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm publish --access public
